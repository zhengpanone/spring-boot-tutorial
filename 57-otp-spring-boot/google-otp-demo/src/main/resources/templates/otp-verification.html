<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证您的身份 | OTP验证</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 自定义样式 -->
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
        }

        body {
            background-color: #f5f7fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .otp-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            margin: 20px auto;
        }

        .otp-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .otp-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .otp-body {
            padding: 30px;
        }

        .otp-input-container {
            display: flex;
            justify-content: space-between;
            margin: 25px 0 30px;
        }

        .otp-input {
            width: 60px;
            height: 70px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .otp-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
            outline: none;
        }

        .otp-input.filled {
            border-color: var(--success-color);
            background-color: rgba(76, 201, 240, 0.05);
        }

        .btn-verify {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 10px;
        }

        .btn-verify:hover {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .btn-verify:active {
            transform: translateY(0);
        }

        .resend-container {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .countdown {
            display: inline-block;
            background-color: #f0f5ff;
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 8px;
        }

        .alert-container {
            transition: all 0.5s ease;
        }

        .otp-info {
            background-color: #f0f8ff;
            border-left: 4px solid var(--primary-color);
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .otp-footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #6c757d;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
        }

        /* 响应式调整 */
        @media (max-width: 576px) {
            .otp-input {
                width: 50px;
                height: 60px;
                font-size: 1.7rem;
            }

            .otp-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="otp-container">
        <!-- 头部 -->
        <div class="otp-header">
            <i class="fas fa-shield-alt otp-icon"></i>
            <h2>安全验证</h2>
            <p class="mb-0">请输入发送到您设备的验证码</p>
        </div>

        <!-- 主体 -->
        <div class="otp-body">
            <!-- 消息提示区域 -->
            <div class="alert-container" th:if="${message}"
                 th:classappend="${messageType == 'error' ? 'alert alert-danger' : 'alert alert-success'}"
                 th:text="${message}" role="alert">
            </div>

            <p>为了保护您的账户安全，我们向以下手机号发送了6位验证码：</p>

            <div class="text-center mb-4">
                <h5 th:text="${phoneNumber != null ? phoneNumber : '+86 138****5678'}">+86 138****5678</h5>
                <small class="text-muted">验证码将在15分钟后失效</small>
            </div>

            <!-- OTP输入框 -->
            <form th:action="@{/verify-otp}" method="post" id="otpForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="otp-input-container">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                           autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                           autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                           autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                           autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                           autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                           autocomplete="off">
                </div>

                <!-- 隐藏的OTP字段，用于表单提交 -->
                <input type="hidden" id="otpCode" name="otpCode" th:value="${otpCode}">

                <button type="submit" class="btn btn-primary btn-verify" id="verifyBtn" disabled>
                    <i class="fas fa-check-circle me-2"></i>验证
                </button>
            </form>

            <!-- 重新发送 -->
            <div class="resend-container">
                <p class="mb-2">没有收到验证码？</p>
                <button class="btn btn-outline-primary" id="resendBtn" disabled>
                    重新发送验证码 <span class="countdown" id="countdown">60</span>秒
                </button>
            </div>

            <!-- 提示信息 -->
            <div class="otp-info">
                <i class="fas fa-info-circle me-2 text-primary"></i>
                请确保手机信号良好，验证码短信可能会稍有延迟。如长时间未收到，请检查是否被拦截到垃圾短信。
            </div>
        </div>

        <!-- 页脚 -->
        <div class="otp-footer">
            <p class="mb-0">如有问题，请联系客服热线: 400-123-4567</p>
            <p class="mb-0">© 2023 安全认证系统. 版权所有</p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 自定义脚本 -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const otpInputs = document.querySelectorAll('.otp-input');
        const otpHiddenInput = document.getElementById('otpCode');
        const verifyBtn = document.getElementById('verifyBtn');
        const resendBtn = document.getElementById('resendBtn');
        const countdownElement = document.getElementById('countdown');
        const otpForm = document.getElementById('otpForm');

        let countdown = 60;
        let countdownInterval;

        // 开始倒计时
        function startCountdown() {
            countdown = 60;
            countdownElement.textContent = countdown;
            resendBtn.disabled = true;

            clearInterval(countdownInterval);
            countdownInterval = setInterval(function () {
                countdown--;
                countdownElement.textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.disabled = false;
                    countdownElement.textContent = '重新发送';
                }
            }, 1000);
        }

        // 初始化倒计时
        startCountdown();

        // OTP输入框逻辑
        otpInputs.forEach((input, index) => {
            // 限制只能输入数字
            input.addEventListener('input', function (e) {
                this.value = this.value.replace(/[^0-9]/g, '');

                // 如果输入了数字，自动跳到下一个输入框
                if (this.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }

                updateOTPValue();
                updateVerifyButton();

                // 更新输入框样式
                if (this.value.length === 1) {
                    this.classList.add('filled');
                } else {
                    this.classList.remove('filled');
                }
            });

            // 处理退格键
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // 处理粘贴事件
            input.addEventListener('paste', function (e) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');

                if (pastedData.length === 6) {
                    // 如果粘贴了6位数字，填充所有输入框
                    for (let i = 0; i < 6; i++) {
                        if (i < otpInputs.length) {
                            otpInputs[i].value = pastedData[i] || '';
                            otpInputs[i].classList.add('filled');
                        }
                    }
                    updateOTPValue();
                    updateVerifyButton();

                    // 自动提交表单
                    setTimeout(() => {
                        if (verifyBtn.disabled === false) {
                            otpForm.submit();
                        }
                    }, 300);
                }
            });
        });

        // 更新隐藏的OTP值
        function updateOTPValue() {
            let otp = '';
            otpInputs.forEach(input => {
                otp += input.value;
            });
            otpHiddenInput.value = otp;
        }

        // 更新验证按钮状态
        function updateVerifyButton() {
            const otp = otpHiddenInput.value;
            verifyBtn.disabled = otp.length !== 6;
        }

        // 重新发送验证码
        resendBtn.addEventListener('click', function () {
            if (!this.disabled) {
                // 这里应该发送AJAX请求到后端重新发送OTP
                // 模拟请求
                this.disabled = true;
                this.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>发送中...';

                // 模拟API请求延迟
                setTimeout(() => {
                    // 重新开始倒计时
                    startCountdown();
                    this.innerHTML = '重新发送验证码 <span class="countdown" id="countdown">60</span>秒';

                    // 清空OTP输入框
                    otpInputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled');
                    });
                    updateOTPValue();
                    updateVerifyButton();

                    // 显示成功消息
                    showMessage('验证码已重新发送到您的手机', 'success');
                }, 1500);
            }
        });

        // 显示消息
        function showMessage(message, type) {
            // 这里可以添加显示消息的逻辑
            console.log(message, type);
        }

        // 表单提交处理
        otpForm.addEventListener('submit', function (e) {
            const otp = otpHiddenInput.value;

            if (otp.length !== 6) {
                e.preventDefault();
                showMessage('请输入6位验证码', 'error');
                return;
            }

            // 添加加载状态
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>验证中...';
        });

        // 页面加载后自动聚焦第一个输入框
        otpInputs[0].focus();
    });
</script>
</body>
</html>
