<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证成功 | 安全验证系统</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .success-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            margin: 20px auto;
            text-align: center;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .success-icon i {
            font-size: 3rem;
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="mb-3 text-success">验证成功！</h1>
        <p class="text-muted mb-4">
            您的身份验证已完成，现在可以安全地使用系统功能。
        </p>

        <!-- 显示成功消息 -->
        <div th:if="${message}" th:classappend="${messageType == 'success' ? 'alert alert-success' : 'alert alert-info'}"
             th:text="${message}" class="alert" role="alert">
        </div>

        <div class="mt-4">
            <p>您可以继续访问以下功能：</p>
            <div class="d-grid gap-3 mt-3">
                <a href="/" class="btn btn-outline-primary">
                    <i class="fas fa-home me-2"></i>返回首页
                </a>
                <a href="#" class="btn btn-primary">
                    <i class="fas fa-user me-2"></i>个人中心
                </a>
                <a href="#" class="btn btn-success">
                    <i class="fas fa-cog me-2"></i>系统设置
                </a>
            </div>
        </div>

        <div class="mt-4 pt-3 border-top">
            <small class="text-muted">
                <i class="fas fa-shield-alt me-1"></i>
                双重验证已启用，您的账户更加安全
            </small>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
