datasource:
  url: localhost:30306/springboot-learn

server:
  port: 8080
  shutdown: graceful

spring:
  mvc:
    async:
      request-timeout: -1
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  datasource:
    url: jdbc:mysql://${datasource.url}?useSSL=false&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  lifecycle:
    timeout-per-shutdown-phase: 30s

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        probes:
          enabled: true
    health:
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true
app:
  version: 1.0.0

mybatis:
  mapper-locations: # mapper映射文件位置
    - classpath:mapper/*.xml
  type-aliases-package: com.zp.pojo
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名规范

logging:
  level:
    org.springframework.web.servlet.view: debug