<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf案例</title>
</head>
<body>
<span th:text="Hello"></span>
<br>
<span th:text="${msg}"></span>
<hr>
<input type="text" th:value="${msg}">
<hr>
<span th:text="${#strings.isEmpty(msg)}"></span>

<span th:text="${#strings.contains(msg,'T')}"></span>
<span th:text="${#strings.startsWith(msg,'T')}"></span>
<br>
<span th:text="${#dates.format(date)}"></span>

<span th:text="${#dates.format(date,'yyy/MM/dd')}"></span>


<span th:text="${#dates.year(date)}"></span>
<span th:text="${#dates.month(date)}"></span>
<span th:text="${#dates.day(date)}"></span>
<hr>


<span th:if="${sex} == '男'"></span>
性别: <span th:text="${sex}"></span>
<span th:if="${sex} =='女'">
    性别: <span th:text="${sex}"></span>
</span>

<div th:switch="${id}">
    <span th:case=1>ID为1</span>
    <span th:case=2>ID为2</span>
    <span th:case=3>ID为3</span>
</div>

<hr>
<table>
    <tr>
        <th></th>
        <th></th>
        <th></th>
    </tr>
    <tr th:each="u : ${user}">
        <td th:text="${u.userId}"></td>
        <td th:text="${u.userName}"></td>
        <td th:text="${u.userAge}"></td>

    </tr>
</table>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Index</th>
        <th>odd</th>
        <th>size</th>
        <th>even</th>
    </tr>
    <tr th:each="u,var : ${user}">
        <td th:text="${u.userId}"></td>
        <td th:text="${u.userName}"></td>
        <td th:text="${u.userAge}"></td>
        <td th:text="${var.index}"></td>
        <td th:text="${var.odd}"></td>
        <td th:text="${var.size}"></td>
        <td th:text="${var.even}"></td>

    </tr>
</table>
<hr>
<div>
    <span>th:each 迭代Map对象</span>
</div>
<table border="1">
    <tr>
        <th>map key</th>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
    </tr>
    <tr th:each="maps : ${map}">
        <td th:each="entry :${maps}" th:text="${entry.key}"></td>
        <td th:each="entry :${maps}" th:text="${entry.value.userId}"></td>
        <td th:each="entry :${maps}" th:text="${entry.value.userName}"></td>
        <td th:each="entry :${maps}" th:text="${entry.value.userAge}"></td>
    </tr>
</table>

<a th:href="@{/index3.html}">绝对路径跳转index3.html</a>
</body>
</html>
